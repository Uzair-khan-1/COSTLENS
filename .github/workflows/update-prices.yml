# Weekly market price update for the frequently changing materials (cement, steel, bricks, sand, crush, wires,
# pipes, tiles, paint, bitumen) in Islamabad, Rawalpindi, Lahore, Karachi, Peshawar and Quetta.
# Add the optional secrets in GitHub: Settings -> Secrets and variables -> Actions:
#   GROQ_API_KEY, GEMINI_API_KEY (AI reading of price pages), TAVILY_API_KEY or BRAVE_API_KEY (search)
name: update-prices
on:
  schedule:
    - cron: "30 1 * * 1"   # every Monday 06:30 Pakistan time
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update prices
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python scripts/update_prices.py
      - name: Commit the new rates
        run: |
          git config user.name "costlens-price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/rates/*.json data/rates/last_update.md || true
          git diff --cached --quiet || git commit -m "Weekly price update $(date +%F)"
          git push
